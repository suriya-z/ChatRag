<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1440px; height: 900px; overflow: hidden; background: #0e1017; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; display: flex; }
.tab-rail { width: 80px; height: 100%; border-right: 1px solid #1e2330; background: #080a0f; display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 12px; }
.tab-step { width: 56px; height: 56px; border-radius: 8px; background: #131722; border: 1px solid #23293a; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #94a3b8; cursor: pointer; }
.tab-step.active { background: #ffb800; color: #0e1017; border-color: #ffb800; }
.sheet-container { flex: 1; padding: 40px; display: flex; gap: 24px; position: relative; }
.acetate-sheet { flex: 2; background: rgba(22, 27, 38, 0.7); backdrop-filter: blur(12px); border: 1px solid #2a3346; border-radius: 12px; padding: 32px; box-shadow: 0 16px 32px rgba(0,0,0,0.4); display: flex; flex-direction: column; gap: 20px; }
.sheet-title { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: -0.02em; }
.overlay-card { background: rgba(14, 16, 23, 0.6); border: 1px solid #ffb800; border-radius: 6px; padding: 16px; font-family: monospace; font-size: 12px; color: #ffb800; }
</style>
</head>
<body>
<div class="tab-rail">
  <div class="tab-step active">01</div>
  <div class="tab-step">02</div>
  <div class="tab-step">03</div>
  <div class="tab-step">04</div>
</div>
<div class="sheet-container">
  <div class="acetate-sheet">
    <div class="sheet-title">Hedged Acetate Index // Document Partition</div>
    <div class="overlay-card">PUNCHED LEAF // 01.04 — pgvector HNSW LEASE</div>
    <p style="font-size: 14px; color: #94a3b8; line-height: 1.6;">Documents partitioned under role-based access control. All queries against the internal engineering knowledge base verify tenant signatures before cosine distance calculation.</p>
  </div>
</div>
</body>
</html>
