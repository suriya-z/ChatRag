<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1440px; height: 900px; overflow: hidden; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; }
aside { width: 240px; height: 100%; border-right: 1px solid #222; background: #0a0a0a; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.item { font-size: 13px; color: #888; padding: 6px 10px; border-radius: 4px; }
.item.active { color: #fff; background: #161616; font-weight: 500; }
main { flex: 1; padding: 32px; background: #000; }
.box { background: #0a0a0a; border: 1px solid #222; border-radius: 8px; padding: 24px; max-width: 800px; }
</style>
</head>
<body>
<aside>
  <div style="font-weight: 600; font-size: 14px; margin-bottom: 12px; color: #fff;">Internal RAG</div>
  <div class="item active">Overview</div>
  <div class="item">Settings</div>
  <div class="item">API Keys</div>
</aside>
<main>
  <div class="box">
    <div style="font-size: 16px; font-weight: 600; margin-bottom: 8px;">Standard SaaS Layout</div>
    <div style="font-size: 13px; color: #666;">The conventional dark developer dashboard standard.</div>
  </div>
</main>
</body>
</html>
